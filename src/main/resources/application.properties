spring.application.name=codegym

# 1. Server Configuration
server.port=8080

# 2. Database Connection (Đã thêm allowPublicKeyRetrieval=true để sửa lỗi kết nối MySQL 8)
spring.datasource.url=jdbc:mysql://localhost:3306/medcare_db?createDatabaseIfNotExist=true&useSSL=false&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 4. SQL Script Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# 5. Thymeleaf Cache
spring.thymeleaf.cache=false

# 6. VNPay Sandbox Configuration
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:8080/payment/vnpay-return
vnpay.tmn-code=CGXZLS0Z
vnpay.hash-secret=XNBCJFAKAZQSGTARRLGCHVZWCIOIGSHN
vnpay.version=2.1.0
vnpay.command=pay

# 7. Mail Server Configuration (Gmail SMTP / Dev fallback)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MEDCARE_MAIL_USERNAME:medcare.clinic.demo@gmail.com}
spring.mail.password=${MEDCARE_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
 
# 8. Google OAuth2 Login
spring.security.oauth2.client.registration.google.client-id=YOUR_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=openid,profile,email
