spring.application.name=codegym

# 1. Server Configuration
server.port=8080

# 2. Database Connection (Đã thêm allowPublicKeyRetrieval=true để sửa lỗi kết nối MySQL 8)
spring.datasource.url=jdbc:mysql://localhost:3306/medcare_db?createDatabaseIfNotExist=true&useSSL=false&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 4. SQL Script Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# 5. Thymeleaf Cache
spring.thymeleaf.cache=false
