<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lịch làm việc bác sĩ | MedCare</title>
    <style>
        body { margin: 0; padding: 28px; background: #f4f7f9; color: #23384a; font-family: "Segoe UI", Arial, sans-serif; }
        main { max-width: 1100px; margin: auto; padding: 26px; border-radius: 12px; background: #fff; box-shadow: 0 5px 22px #18344a12; }
        h1 { margin: 0 0 8px; }
        .hint { color: #5c7181; margin: 0 0 22px; }
        .alert { padding: 12px; margin: 12px 0; border-radius: 7px; background: #e5f5eb; color: #1d6034; }
        .error { background: #fce8e8; color: #8b2222; }
        .days { display: grid; gap: 14px; }
        .day { border: 1px solid #e2eaee; border-radius: 9px; padding: 16px; }
        .day-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
        h2 { font-size: 18px; margin: 0; color: #173b55; }
        .quick-actions { display: flex; gap: 7px; flex-wrap: wrap; }
        .quick-button { padding: 6px 10px; border: 1px solid #cddde3; border-radius: 6px; background: #fff; color: #315469; font: inherit; font-size: 13px; cursor: pointer; }
        .quick-button:hover, .quick-button:focus-visible { border-color: #087e8b; color: #087e8b; background: #eff9f9; }
        .period { padding: 12px; border-radius: 8px; background: #f8fafb; }
        .period + .period { margin-top: 12px; }
        .period-title { margin: 0 0 9px; color: #526b7a; font-size: 13px; font-weight: 700; }
        .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 8px; }
        .slot { display: flex; align-items: center; gap: 7px; padding: 8px; border-radius: 6px; background: #fff; }
        input { accent-color: #087e8b; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
        .button { display: inline-block; padding: 10px 15px; border: 0; border-radius: 7px; background: #087e8b; color: #fff; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
        .secondary { background: #eaf2f5; color: #254256; }
        @media(max-width: 700px) { body { padding: 12px; } main { padding: 17px; } }
    </style>
</head>
<body>
<main>
    <h1>Lịch làm việc</h1>
    <p class="hint">
        <strong th:text="${doctor.name}">Tên bác sĩ</strong>
        — chọn các ca bác sĩ nhận khám lặp lại theo từng ngày trong tuần.
        Bác sĩ chưa có ca nào được chọn sẽ không nhận lịch đặt mới.
    </p>
    <div class="alert" th:if="${successMsg}" th:text="${successMsg}"></div>
    <div class="alert error" th:if="${errorMsg}" th:text="${errorMsg}"></div>
    <form th:action="@{/admin/catalog/doctors/{id}/schedule(id=${doctor.id})}" method="post">
        <div class="days">
            <section class="day" th:each="day : ${days}">
                <div class="day-header">
                    <h2 th:text="${dayLabels[day.name()]}">Thứ 2</h2>
                    <div class="quick-actions" aria-label="Chọn nhanh ca khám">
                        <button class="quick-button" type="button" data-select-period="morning">Chọn sáng</button>
                        <button class="quick-button" type="button" data-select-period="afternoon">Chọn chiều</button>
                        <button class="quick-button" type="button" data-select-period="all">Chọn tất cả</button>
                        <button class="quick-button" type="button" data-select-period="none">Bỏ chọn</button>
                    </div>
                </div>
                <div class="period">
                    <h3 class="period-title">Ca sáng</h3>
                    <div class="slots">
                        <label class="slot" th:each="slot : ${timeSlots}" th:if="${slot.startTime.hour < 12}">
                            <input type="checkbox" name="slotSelections" data-period="morning"
                                   th:value="${day.name() + '-' + slot.id}"
                                   th:checked="${selectedSlots.contains(day.name() + '-' + slot.id)}">
                            <span th:text="${slot.displayText}">08:00</span>
                        </label>
                    </div>
                </div>
                <div class="period">
                    <h3 class="period-title">Ca chiều</h3>
                    <div class="slots">
                        <label class="slot" th:each="slot : ${timeSlots}" th:if="${slot.startTime.hour >= 12}">
                            <input type="checkbox" name="slotSelections" data-period="afternoon"
                                   th:value="${day.name() + '-' + slot.id}"
                                   th:checked="${selectedSlots.contains(day.name() + '-' + slot.id)}">
                            <span th:text="${slot.displayText}">13:00</span>
                        </label>
                    </div>
                </div>
            </section>
        </div>
        <div class="actions">
            <button class="button" type="submit">Lưu lịch làm việc</button>
            <a class="button secondary" th:href="@{/admin/catalog/doctors}">Quay lại</a>
        </div>
    </form>
</main>
<script>
    document.querySelectorAll(".day").forEach(dayCard => {
        dayCard.querySelectorAll("[data-select-period]").forEach(button => {
            button.addEventListener("click", () => {
                const period = button.dataset.selectPeriod;
                dayCard.querySelectorAll('input[name="slotSelections"]').forEach(checkbox => {
                    if (period === "none") {
                        checkbox.checked = false;
                    } else if (period === "all" || checkbox.dataset.period === period) {
                        checkbox.checked = true;
                    }
                });
            });
        });
    });
</script>
</body>
</html>
