<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý chuyên khoa | MedCare</title>
    <style>
        body { margin: 0; padding: 0; background: #f4f7f9; color: #23384a; font-family: "Segoe UI", Arial, sans-serif; }
        main { max-width: 1100px; margin: auto; padding: 26px; border-radius: 12px; background: white; box-shadow: 0 5px 22px #18344a12; }
        .head, .actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
        h1 { margin: 0 0 18px; }
        .button { display: inline-block; padding: 9px 13px; border: 0; border-radius: 7px; background: #087e8b; color: white; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
        .secondary { background: #eaf2f5; color: #254256; }
        .danger { background: #b53b47; }
        .alert { padding: 12px; margin: 12px 0; border-radius: 7px; background: #e5f5eb; color: #1d6034; }
        .error { display: block; margin-top: 5px; color: #b4232c; font-size: 12px; }
        .create { display: grid; grid-template-columns: 1fr 2fr 1fr auto; gap: 10px; align-items: end; padding: 16px; border-radius: 9px; background: #f4f8fa; }
        label { display: block; margin-bottom: 5px; color: #4d6475; font-size: 12px; font-weight: 700; }
        input, textarea { width: 100%; box-sizing: border-box; padding: 9px; border: 1px solid #cbd9e0; border-radius: 6px; font: inherit; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th, td { padding: 12px 9px; border-bottom: 1px solid #e5ecef; text-align: left; }
        th { color: #5c7181; font-size: 13px; }
        .edit-form { display: grid; grid-template-columns: 1fr 1.6fr 1fr auto; gap: 8px; align-items: center; }
        .state { font-size: 12px; font-weight: 700; }
        @media(max-width: 760px) { body { padding: 12px; } main { padding: 16px; overflow-x: auto; } .create { grid-template-columns: 1fr; } table { min-width: 750px; } }
    </style>
    <th:block th:replace="~{fragments/admin-layout :: styles}"></th:block>
</head>
<body>
<header th:replace="~{fragments/admin-layout :: header}"></header>
<div class="admin-shell">
    <aside th:replace="~{fragments/admin-layout :: sidebar}"></aside>
    <div class="admin-main">
<main>
    <div class="head">
        <h1>Quản lý chuyên khoa</h1>
        <div class="actions">
            <a class="button secondary" th:href="@{/admin/catalog/doctors}">Quản lý bác sĩ</a>
            <a class="button secondary" th:href="@{/admin/appointments}">Lịch hẹn</a>
        </div>
    </div>
    <div class="alert" th:if="${successMsg}" th:text="${successMsg}"></div>
    <div class="alert" style="background:#fce8e8;color:#8b2222" th:if="${errorMsg}" th:text="${errorMsg}"></div>

    <form class="create" th:action="@{/admin/catalog/specialties/save}" th:object="${specialtyForm}" method="post">
        <div><label for="newName">Tên chuyên khoa mới</label><input id="newName" th:field="*{name}" required maxlength="100"><span class="error" th:errors="*{name}"></span></div>
        <div><label for="newDescription">Mô tả</label><input id="newDescription" th:field="*{description}"></div>
        <div><label for="newIcon">Đường dẫn icon (tùy chọn)</label><input id="newIcon" th:field="*{iconUrl}" maxlength="255"></div>
        <button class="button" type="submit">Thêm chuyên khoa</button>
    </form>

    <table>
        <thead><tr><th>Chuyên khoa</th><th>Mô tả</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
        <tbody>
        <tr th:each="specialty : ${specialties}">
            <td colspan="4">
                <form class="edit-form" th:action="@{/admin/catalog/specialties/save}" method="post">
                    <input type="hidden" name="id" th:value="${specialty.id}">
                    <input type="hidden" name="active" th:value="${specialty.active}">
                    <input name="name" th:value="${specialty.name}" required maxlength="100" aria-label="Tên chuyên khoa">
                    <input name="description" th:value="${specialty.description}" aria-label="Mô tả chuyên khoa">
                    <span class="state" th:text="${specialty.active ? 'Đang hoạt động' : 'Đang ẩn'}">Đang hoạt động</span>
                    <div class="actions">
                        <button class="button secondary" type="submit">Lưu</button>
                        <button class="button" th:classappend="${specialty.active} ? ' danger' : ''"
                                type="submit" formmethod="post"
                                th:formaction="@{/admin/catalog/specialties/{id}/toggle(id=${specialty.id})}"
                                th:text="${specialty.active ? 'Ẩn' : 'Hiện'}">Ẩn</button>
                    </div>
                </form>
            </td>
        </tr>
        <tr th:if="${specialties.isEmpty()}"><td colspan="4">Chưa có chuyên khoa.</td></tr>
        </tbody>
    </table>
</main>
</div>
</div>
<footer th:replace="~{fragments/admin-layout :: footer}"></footer>
</body>
</html>
