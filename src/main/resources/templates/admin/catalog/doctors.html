<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý bác sĩ | MedCare</title>
    <style>
        body { margin: 0; padding: 28px; background: #f4f7f9; color: #23384a; font-family: "Segoe UI", Arial, sans-serif; }
        main { max-width: 1100px; margin: auto; padding: 26px; border-radius: 12px; background: #fff; box-shadow: 0 5px 22px #18344a12; }
        .head, .actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
        h1 { margin: 0 0 20px; }
        a, button { font: inherit; }
        .button { display: inline-block; padding: 9px 14px; border: 0; border-radius: 7px; background: #087e8b; color: white; font-weight: 700; text-decoration: none; cursor: pointer; }
        .secondary { background: #eaf2f5; color: #254256; }
        .danger { background: #b53b47; }
        .alert { padding: 12px; margin: 12px 0; border-radius: 7px; background: #e5f5eb; color: #1d6034; }
        .error { background: #fce8e8; color: #8b2222; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px 10px; border-bottom: 1px solid #e5ecef; text-align: left; vertical-align: top; }
        th { color: #5c7181; font-size: 13px; }
        .status { padding: 4px 8px; border-radius: 20px; background: #e7f4ea; font-size: 12px; font-weight: 700; }
        .inactive { background: #f6e7e8; color: #8b2222; }
        .actions form { margin: 0; }
        @media(max-width: 700px) { body { padding: 12px; } main { padding: 16px; overflow-x: auto; } table { min-width: 720px; } }
    </style>
</head>
<body>
<main>
    <div class="head">
        <h1>Quản lý bác sĩ</h1>
        <div class="actions">
            <a class="button secondary" th:href="@{/admin/appointments}">Lịch hẹn</a>
            <a class="button secondary" th:href="@{/admin/catalog/specialties}">Quản lý chuyên khoa</a>
            <a class="button" th:href="@{/admin/catalog/doctors/new}">+ Thêm bác sĩ</a>
        </div>
    </div>
    <div class="alert" th:if="${successMsg}" th:text="${successMsg}"></div>
    <div class="alert error" th:if="${errorMsg}" th:text="${errorMsg}"></div>
    <table>
        <thead><tr><th>Bác sĩ</th><th>Chuyên khoa</th><th>Phí khám</th><th>Tài khoản</th><th>Hiển thị</th><th>Thao tác</th></tr></thead>
        <tbody>
        <tr th:each="doctor : ${doctors}">
            <td><strong th:text="${doctor.name}">Tên bác sĩ</strong><br><span th:text="${doctor.degree}">Học vị</span></td>
            <td th:text="${doctor.specialty.name}">Chuyên khoa</td>
            <td th:text="${doctor.consultationFee != null ? #numbers.formatDecimal(doctor.consultationFee, 0, 'COMMA', 0, 'POINT') + ' VNĐ' : 'Liên hệ'}">300.000 VNĐ</td>
            <td th:text="${doctorUsernames[doctor.id]}">doctor.user</td>
            <td><span class="status" th:classappend="${doctor.active} ? '' : ' inactive'"
                      th:text="${doctor.active ? 'Đang hiển thị' : 'Đang ẩn'}">Đang hiển thị</span></td>
            <td>
                <div class="actions" style="justify-content:flex-start">
                    <a class="button secondary" th:href="@{/admin/catalog/doctors/{id}/edit(id=${doctor.id})}">Sửa</a>
                    <a class="button secondary" th:href="@{/admin/catalog/doctors/{id}/schedule(id=${doctor.id})}">Lịch làm việc</a>
                    <form th:action="@{/admin/catalog/doctors/{id}/toggle(id=${doctor.id})}" method="post">
                        <button class="button" th:classappend="${doctor.active} ? ' danger' : ''"
                                type="submit" th:text="${doctor.active ? 'Ẩn' : 'Hiện'}">Ẩn</button>
                    </form>
                </div>
            </td>
        </tr>
        <tr th:if="${doctors.isEmpty()}"><td colspan="6">Chưa có hồ sơ bác sĩ.</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
