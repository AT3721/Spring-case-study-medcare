<div th:fragment="widget" xmlns:th="http://www.thymeleaf.org">
    <style>
        .clinic-assistant-launcher { position: fixed; right: 24px; bottom: 24px; z-index: 900; display: inline-flex; align-items: center; gap: 10px; padding: 13px 18px; border: 0; border-radius: 999px; background: #087e8b; color: #fff; box-shadow: 0 8px 24px #075b6840; font: inherit; font-weight: 750; cursor: pointer; }
        .clinic-assistant-launcher:hover { background: #06636e; transform: translateY(-1px); }
        .clinic-assistant-panel { position: fixed; right: 24px; bottom: 86px; z-index: 901; display: none; width: min(390px, calc(100vw - 28px)); height: min(580px, calc(100vh - 120px)); flex-direction: column; overflow: hidden; border: 1px solid #dce7ec; border-radius: 16px; background: #fff; box-shadow: 0 18px 55px #102b3d35; }
        .clinic-assistant-panel.open { display: flex; }
        .clinic-assistant-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 17px; background: #087e8b; color: #fff; }
        .clinic-assistant-title { margin: 0; font-size: 16px; }
        .clinic-assistant-subtitle { display: block; margin-top: 3px; color: #d8f2f0; font-size: 12px; font-weight: 400; }
        .clinic-assistant-close { width: 34px; height: 34px; border: 0; border-radius: 50%; background: #ffffff20; color: #fff; font-size: 23px; cursor: pointer; }
        .clinic-assistant-notice { margin: 10px 12px 0; padding: 9px 10px; border-radius: 8px; background: #fff8e7; color: #68532b; font-size: 11px; line-height: 1.45; }
        .clinic-assistant-messages { display: flex; flex: 1; flex-direction: column; gap: 10px; overflow-y: auto; padding: 13px 12px; }
        .clinic-assistant-message { max-width: 90%; padding: 10px 12px; border-radius: 12px; color: #29465a; font-size: 13px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
        .clinic-assistant-message.bot { align-self: flex-start; border: 1px solid #e3ecef; background: #f5f8f9; }
        .clinic-assistant-message.user { align-self: flex-end; background: #e6f5f4; }
        .clinic-assistant-links { display: flex; flex-wrap: wrap; gap: 7px; margin-top: -4px; }
        .clinic-assistant-link, .clinic-assistant-prompt { padding: 7px 10px; border: 1px solid #b8dfe0; border-radius: 999px; background: #fff; color: #06636e; font-size: 12px; font-weight: 700; text-decoration: none; cursor: pointer; }
        .clinic-assistant-link:hover, .clinic-assistant-prompt:hover { background: #eaf7f7; }
        .clinic-assistant-prompts { display: flex; gap: 7px; overflow-x: auto; padding: 0 12px 10px; }
        .clinic-assistant-form { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid #e8eef1; }
        .clinic-assistant-input { min-width: 0; flex: 1; padding: 10px 11px; border: 1px solid #cbd9df; border-radius: 9px; font: inherit; font-size: 13px; }
        .clinic-assistant-send { padding: 0 13px; border: 0; border-radius: 9px; background: #087e8b; color: #fff; font-weight: 750; cursor: pointer; }
        .clinic-assistant-send:disabled { opacity: .55; cursor: wait; }
        @media(max-width: 520px) {
            .clinic-assistant-launcher { right: 14px; bottom: 14px; padding: 12px 15px; }
            .clinic-assistant-panel { right: 10px; bottom: 72px; width: calc(100vw - 20px); height: min(560px, calc(100vh - 96px)); }
        }
        @media(prefers-reduced-motion: reduce) { .clinic-assistant-launcher { transition: none; } }
    </style>
    <button class="clinic-assistant-launcher" id="clinicAssistantOpen" type="button"
            aria-haspopup="dialog" aria-controls="clinicAssistantPanel" aria-expanded="false">
        <span aria-hidden="true">✦</span> Trợ lý MedCare
    </button>
    <section class="clinic-assistant-panel" id="clinicAssistantPanel" role="dialog"
             aria-modal="false" aria-labelledby="clinicAssistantTitle" aria-hidden="true">
        <header class="clinic-assistant-head">
            <div>
                <h2 class="clinic-assistant-title" id="clinicAssistantTitle">Trợ lý MedCare</h2>
                <span class="clinic-assistant-subtitle">Hỗ trợ tìm bác sĩ và đặt lịch</span>
            </div>
            <button class="clinic-assistant-close" id="clinicAssistantClose" type="button" aria-label="Đóng">&times;</button>
        </header>
        <p class="clinic-assistant-notice">Thông tin chỉ để tham khảo, không chẩn đoán/kê đơn. Không nhập họ tên, số điện thoại hoặc hồ sơ khám. Tin nhắn không được lưu.</p>
        <div class="clinic-assistant-messages" id="clinicAssistantMessages" aria-live="polite" aria-relevant="additions">
            <div class="clinic-assistant-message bot">Xin chào! Tôi có thể giúp bạn tìm chuyên khoa, bác sĩ, khung giờ còn trống hoặc hướng dẫn đặt lịch.</div>
        </div>
        <div class="clinic-assistant-prompts" aria-label="Câu hỏi gợi ý">
            <button class="clinic-assistant-prompt" type="button">Cách đặt lịch</button>
            <button class="clinic-assistant-prompt" type="button">Danh sách chuyên khoa</button>
            <button class="clinic-assistant-prompt" type="button">Khung giờ 28/10/2026</button>
        </div>
        <form class="clinic-assistant-form" id="clinicAssistantForm">
            <input class="clinic-assistant-input" id="clinicAssistantInput" maxlength="500"
                   autocomplete="off" placeholder="Nhập câu hỏi..." aria-label="Tin nhắn cho trợ lý">
            <button class="clinic-assistant-send" type="submit">Gửi</button>
        </form>
    </section>
    <script>
        (() => {
            const launcher = document.getElementById('clinicAssistantOpen');
            const panel = document.getElementById('clinicAssistantPanel');
            const close = document.getElementById('clinicAssistantClose');
            const form = document.getElementById('clinicAssistantForm');
            const input = document.getElementById('clinicAssistantInput');
            const messages = document.getElementById('clinicAssistantMessages');
            const send = form.querySelector('button[type="submit"]');
            const csrfToken = document.querySelector('meta[name="_csrf"]').content;
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

            function setOpen(open) {
                panel.classList.toggle('open', open);
                panel.setAttribute('aria-hidden', String(!open));
                launcher.setAttribute('aria-expanded', String(open));
                if (open) input.focus();
                else launcher.focus();
            }
            function addMessage(text, type) {
                const message = document.createElement('div');
                message.className = `clinic-assistant-message ${type}`;
                message.textContent = text;
                messages.append(message);
                messages.scrollTop = messages.scrollHeight;
            }
            function addLinks(links) {
                if (!Array.isArray(links) || links.length === 0) return;
                const container = document.createElement('div');
                container.className = 'clinic-assistant-links';
                links.forEach(item => {
                    if (!item || typeof item.label !== 'string' || typeof item.url !== 'string') return;
                    const url = new URL(item.url, window.location.origin);
                    if (url.origin !== window.location.origin && url.protocol !== 'tel:') return;
                    const anchor = document.createElement('a');
                    anchor.className = 'clinic-assistant-link';
                    anchor.href = url.href;
                    anchor.textContent = item.label;
                    container.append(anchor);
                });
                if (container.childElementCount) messages.append(container);
                messages.scrollTop = messages.scrollHeight;
            }
            async function sendMessage(text) {
                const message = text.trim();
                if (!message || message.length > 500) return;
                addMessage(message, 'user');
                input.value = '';
                send.disabled = true;
                try {
                    const response = await fetch('/api/assistant/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            [csrfHeader]: csrfToken
                        },
                        body: JSON.stringify({ message })
                    });
                    if (!response.ok) throw new Error('Hiện chưa gửi được câu hỏi. Vui lòng thử lại.');
                    const data = await response.json();
                    if (typeof data.message !== 'string') throw new Error('Phản hồi không đúng định dạng.');
                    addMessage(data.message, 'bot');
                    addLinks(data.links);
                } catch (error) {
                    addMessage(error.message, 'bot');
                } finally {
                    send.disabled = false;
                    input.focus();
                }
            }
            launcher.addEventListener('click', () => setOpen(true));
            close.addEventListener('click', () => setOpen(false));
            form.addEventListener('submit', event => {
                event.preventDefault();
                sendMessage(input.value);
            });
            document.querySelectorAll('.clinic-assistant-prompt').forEach(button => {
                button.addEventListener('click', () => sendMessage(button.textContent));
            });
            document.addEventListener('keydown', event => {
                if (event.key === 'Escape' && panel.classList.contains('open')) setOpen(false);
            });
        })();
    </script>
</div>
