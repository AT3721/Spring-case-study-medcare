<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt Lịch Thành Công - MedCare</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8f9fa; padding: 50px; text-align: center; }
        .success-card { max-width: 500px; margin: 0 auto; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .code { font-size: 32px; font-weight: bold; color: #28a745; letter-spacing: 2px; margin: 20px 0; background: #e8f5e9; padding: 10px; border-radius: 5px; }
        .btn-home { display: inline-block; padding: 10px 20px; background: #0056b3; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

<div class="success-card">
    <h1 style="color: #28a745;">🎉 Đặt Lịch Thành Công!</h1>
    <p>Cảm ơn quý khách đã tin tưởng dịch vụ MedCare. Mã tra cứu lịch hẹn của bạn là:</p>

    <div class="code" th:text="${bookingSuccessCode != null ? bookingSuccessCode : 'MC-...'}">MC-...</div>

    <p style="font-size: 14px; color: #6c757d;">Vui lòng lưu lại mã này để tra cứu trạng thái lịch khám.</p>

    <a th:href="@{/doctors}" class="btn-home">Quay Lại Danh Sách Bác Sĩ</a>
</div>

</body>
</html>
