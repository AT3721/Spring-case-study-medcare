<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng Nhập Quản Trị - MedCare</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 100%; max-width: 380px; }
        h2 { text-align: center; color: #0056b3; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; color: #495057; font-size: 14px; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        .btn-login { width: 100%; padding: 12px; background: #0056b3; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; transition: background 0.2s; }
        .btn-login:hover { background: #004085; }
        .alert-error { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; font-size: 13px; text-align: center; margin-bottom: 15px; }
        .alert-logout { background: #d4edda; color: #155724; padding: 10px; border-radius: 5px; font-size: 13px; text-align: center; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>🔐 MedCare Admin</h2>

    <!-- Thông báo lỗi khi nhập sai TK/MK -->
    <div th:if="${param.error}" class="alert-error">
        Tên đăng nhập hoặc mật khẩu không chính xác!
    </div>

    <!-- Thông báo sau khi Đăng xuất -->
    <div th:if="${param.logout}" class="alert-logout">
        Bạn đã đăng xuất thành công.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>Tên Đăng Nhập (Username):</label>
            <input type="text" name="username" placeholder="Nhập admin hoặc staff" required />
        </div>

        <div class="form-group">
            <label>Mật Khẩu (Password):</label>
            <input type="password" name="password" placeholder="Mật khẩu" required />
        </div>

        <button type="submit" class="btn-login">Đăng Nhập</button>
    </form>

    <div style="text-align: center; margin-top: 20px;">
        <a th:href="@{/doctors}" style="color: #0056b3; font-size: 13px; text-decoration: none;">← Quay lại trang Bệnh nhân</a>
    </div>
</div>

</body>
</html>
