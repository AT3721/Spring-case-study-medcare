<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đặt Lại Mật Khẩu - MedCare</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 36px 32px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); width: 100%; max-width: 420px; }
        h2 { text-align: center; color: #0056b3; margin: 0 0 10px; font-size: 22px; }
        p.subtitle { text-align: center; color: #64748b; font-size: 14px; margin: 0 0 22px; line-height: 1.5; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; color: #334155; font-size: 14px; }
        input { width: 100%; padding: 11px 13px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        input:focus { border-color: #0056b3; outline: none; box-shadow: 0 0 0 3px rgba(0,86,179,0.15); }
        .error { color: #dc2626; font-size: 13px; margin-top: 5px; display: block; }
        .btn-submit { width: 100%; padding: 12px; background: #0056b3; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background: #004085; }
        .alert-error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 18px; border-radius: 8px; font-size: 14px; line-height: 1.55; text-align: center; margin-bottom: 20px; }
        .alert-error strong { display: block; font-size: 16px; margin-bottom: 6px; }
        .btn-retry { display: inline-block; margin-top: 14px; padding: 10px 18px; background: #b91c1c; color: white; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 14px; }
        .btn-retry:hover { background: #991b1b; }
        .back-link { text-align: center; margin-top: 22px; font-size: 14px; }
        .back-link a { color: #0056b3; text-decoration: none; font-weight: 600; }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="card">
    <h2>🔒 Đặt Lại Mật Khẩu</h2>

    <!-- Trạng thái token không hợp lệ hoặc hết hạn -->
    <div th:if="${invalidToken}" class="alert-error">
        <strong>⚠️ Liên kết không hợp lệ hoặc đã hết hạn</strong>
        <p style="margin: 0;">Đường link đặt lại mật khẩu này không tồn tại, đã từng được sử dụng hoặc đã vượt quá thời hạn hiệu lực <b>15 phút</b>.</p>
        <a th:href="@{/forgot-password}" class="btn-retry">Yêu cầu liên kết mới</a>
    </div>

    <!-- Form nhập mật khẩu mới nếu token hợp lệ -->
    <div th:unless="${invalidToken}">
        <p class="subtitle">Vui lòng nhập mật khẩu mới cho tài khoản của bạn.</p>

        <form th:action="@{/reset-password}" th:object="${resetPasswordForm}" method="post">
            <input type="hidden" th:field="*{token}" />

            <div class="form-group">
                <label for="password">Mật khẩu mới (tối thiểu 6 ký tự):</label>
                <input type="password" id="password" th:field="*{password}" placeholder="Nhập mật khẩu mới" required autofocus />
                <span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Xác nhận mật khẩu mới:</label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" placeholder="Nhập lại mật khẩu mới" required />
                <span class="error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
            </div>

            <button type="submit" class="btn-submit">Lưu Mật Khẩu Mới</button>
        </form>
    </div>

    <div class="back-link">
        <a th:href="@{/login}">← Quay lại Đăng nhập</a>
    </div>
</div>

</body>
</html>
